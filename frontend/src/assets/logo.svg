<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9eff00" />
      <stop offset="100%" stop-color="#108e57" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing background rings -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#flowGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8, 4" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Central Focus Node -->
  <circle cx="50" cy="50" r="16" fill="url(#flowGrad)" filter="url(#glow)" />
  
  <!-- Inner Brainwave Line -->
  <path d="M42 50 C45 44, 48 56, 50 50 C52 44, 55 56, 58 50" fill="none" stroke="#030d08" stroke-width="2" stroke-linecap="round" />
</svg>
